name: 💡 Feature request
description: Suggest a new capability or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! A clear problem statement helps us evaluate it much faster than a solution alone.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where the current app falls short.
      placeholder: "During a meeting, cardiologists often want to compare two CT slices side by side, but the shared window can only show one exam at a time."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches or mockups are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or how you work around it today.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of ATRIA does this concern?
      options:
        - visionOS app — DICOM viewing / windowing
        - visionOS app — SharePlay / sync
        - visionOS app — 2D annotations
        - visionOS app — 3D immersive drawing
        - macOS companion app (ATRIAmac)
        - .atria package format / iCloud
        - Documentation
        - Other
    validations:
      required: true
