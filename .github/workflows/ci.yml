name: CI

on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-debug-flags:
    name: Debug flags are off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify bypassSharePlay is false
        run: |
          if ! grep -q 'static let bypassSharePlay = false' ATRIA/App/DebugFlags.swift; then
            echo '::error file=ATRIA/App/DebugFlags.swift::bypassSharePlay must be false — never merge with debug flags enabled (see CONTRIBUTING.md)'
            exit 1
          fi

  test-macos:
    name: macOS companion tests (ATRIAmac)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run ATRIAmac tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ATRIA.xcodeproj \
            -scheme ATRIAmac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

  test-visionos:
    name: visionOS app tests (ATRIA)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Ensure visionOS simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q visionOS; then
            echo "visionOS runtime not preinstalled — downloading"
            sudo xcodebuild -downloadPlatform visionOS
          fi
          xcrun simctl list devices 'Apple Vision Pro'
      - name: Boot visionOS simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices 'Apple Vision Pro' | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Run ATRIA tests
        run: |
          set -o pipefail
          n=0
          until [ "$n" -ge 2 ]; do
            xcodebuild test \
              -project ATRIA.xcodeproj \
              -scheme ATRIA \
              -destination "platform=visionOS Simulator,id=$UDID" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" && break
            n=$((n + 1))
            echo "Test run failed (attempt $n) — retrying after simulator restart"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
          done
          [ "$n" -lt 2 ]
